version: "1.0"
standard: "GB 50300-2013"
description: WBS 分部分项映射唯一来源（迁自 map_wbs.py 内置字典，文档副本见 references/gb50300-division.md）

divisions:
  地基与基础:
    子分部: [地基, 基础, 基坑支护, 地下水控制, 土方, 边坡]
    分项_keywords:
      混凝土基础: [垫层, 承台, 基础梁, 独立基础, 筏板, 桩]
      砌体基础: [砖基础, 毛石基础]
      桩基: [灌注桩, 预制桩, CFG桩]
  主体结构:
    子分部: [混凝土结构, 砌体结构, 钢结构, 木结构, 钢管混凝土结构, 型钢混凝土结构]
    分项_keywords:
      混凝土结构: [柱, 梁, 板, 墙, 楼梯, 后浇带, 施工缝]
      砌体结构: [砖砌体, 砌块, 填充墙]
      模板: [模板, 支架]
      钢筋: [钢筋, 配筋]
  建筑装饰装修:
    子分部: [地面, 抹灰, 门窗, 吊顶, 轻质隔墙, 饰面板, 涂饰, 裱糊与软包, 细部]
    分项_keywords:
      门窗: [门, 窗]
      地面: [地面, 楼面, 地砖, 地板]
      抹灰: [抹灰, 腻子]
      涂饰: [涂料, 油漆]
  屋面:
    子分部: [基层与保护, 保温与隔热, 防水与密封, 瓦面与板面, 细部构造]
    分项_keywords:
      防水: [防水, 卷材, 涂膜]
      保温: [保温, 隔热, 挤塑板]
      瓦面: [瓦, 屋面瓦]
  建筑给水排水及供暖:
    子分部: [室内给水系统, 室内排水系统, 室内热水系统, 卫生器具, 室内供暖系统, 室外给水管网, 室外排水管网, 室外供热管网, 建筑饮用水供应系统, 建筑中水系统及雨水利用系统, 游泳池及公共浴池水系统, 水景喷泉系统, 热源及辅助设备, 监测与控制仪表]
    分项_keywords:
      给水管道: [给水, 冷水, 热水, 给水管]
      排水管道: [排水, 污水, 雨水, 排水管, 地漏]
      卫生器具: [洁具, 马桶, 洗手盆, 淋浴]
      消火栓: [消火栓, 消防箱]
      喷淋: [喷淋, 喷头, 消防管]
  通风与空调:
    子分部: [送风系统, 排风系统, 防排烟系统, 除尘系统, 舒适性空调系统, 恒温恒湿空调系统, 净化空调系统, 地下人防通风系统, 真空吸尘系统, 冷凝水系统, 空调水系统, 设备自控系统]
    分项_keywords:
      风管: [风管, 风道]
      风口: [风口, 散流器, 百叶]
      空调设备: [空调, 风机, AHU, FCU, 新风机]
      水管: [冷媒管, 冷凝水管, 空调水管]
  建筑电气:
    子分部: [室外电气, 变配电室, 供电干线, 电气动力, 电气照明, 备用和不间断电源, 防雷及接地安装]
    分项_keywords:
      照明: [照明, 灯具, 灯]
      动力: [配电箱, 配电柜, 电缆, 桥架]
      插座: [插座, 开关]
      防雷接地: [防雷, 接地, 避雷, 引下线]
  智能建筑:
    子分部: [智能化集成系统, 信息接入系统, 用户电话交换系统, 信息网络系统, 综合布线系统, 移动通信室内信号覆盖系统, 卫星通信系统, 有线电视及卫星电视接收系统, 公共广播系统, 会议系统, 信息导引及发布系统, 时钟系统, 信息化应用系统, 建筑设备监控系统, 火灾自动报警系统, 安全技术防范系统, 应急响应系统, 机房, 防雷与接地]
    分项_keywords:
      综合布线: [网线, 双绞线, 光纤, 信息点]
      安防: [监控, 摄像机, 门禁, 报警]
      消防报警: [烟感, 温感, 火灾报警, 手报]
  建筑节能:
    子分部: [围护系统节能, 供暖空调设备及管网节能, 电气动力节能, 监控系统节能, 可再生能源]
    分项_keywords:
      围护节能: [保温, 隔热, 节能窗, 遮阳]
      空调节能: [变频, 能效]
      电气节能: [LED, 节能灯具]
  电梯:
    子分部: [电力驱动的曳引式或强制式电梯, 液压电梯, 自动扶梯, 自动人行道]
    分项_keywords:
      电梯: [电梯, 扶梯, 曳引机]


    block: {家具: 3, 灯具: 2, 洁具: 2, 饰面: 3}
    text: {装饰: 3, 装修: 3, 地面: 3, 墙面: 3, 天花: 3, 材料表: 3}

# 图层名弱判定（合并 map_wbs 与 aggregate 两处，取并集；命中即返回，顺序即优先级）
layer_keywords:
  建筑: [墙, 门, 窗, WALL, DOOR, 建]
  结构: [柱, 梁, 板, COLUMN, BEAM, 结]
  给排水: [水, PIPE, DRAIN, WATER, 排]
  电气: [灯, 插座, ELEC, LIGHT, 电]
  暖通: [风, DUCT, HVAC, 暖]

    text: {给水: 3, 排水: 3, DN: 3, 管径: 3, 消火栓: 3, 喷淋: 3, 给排水: 3, 系统图: 2}
  电气:
    layer: {照明: 3, 插座: 3, 开关: 3, 配电箱: 3, 桥架: 3, 电缆: 3, 防雷: 3, 接地: 3, LIGHT: 3, POWER: 3, SOCKET: 3, ELEC: 3, CABLE: 3, TRAY: 3}
    block: {灯具: 3, 插座: 3, 开关: 3, 配电箱: 3, LIGHT: 3, SOCKET: 3}
    text: {照明: 3, 插座: 3, 配电: 3, 电气: 3, BV: 3, YJV: 3, 回路: 3, 配电箱: 3, 强电: 3, 弱电: 3}
  暖通:
    layer: {风管: 3, 风口: 3, 空调: 3, 风机: 3, 冷媒: 3, 冷凝水: 3, 保温: 2, DUCT: 3, AHU: 3, FCU: 3, HVAC: 3}

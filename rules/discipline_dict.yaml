    layer: {墙: 3, 门: 3, 窗: 3, 轴线: 3, 楼梯: 3, 房间: 2, 标高: 2, WALL: 3, DOOR: 3, WINDOW: 3, AXIS: 3, STAIR: 3, FLOOR: 2, ARCH: 2, 建: 2}
    block: {门: 3, 窗: 3, 楼梯: 3, 洁具: 2, 家具: 2, DOOR: 3, WINDOW: 3}
    text: {平面图: 3, 立面图: 3, 剖面图: 3, 房间: 2, 卫生间: 2, 办公室: 2, 会议室: 2, 走廊: 2, 建筑面积: 3}
  结构:
    layer: {柱: 3, 梁: 3, 板: 3, 基础: 3, 钢筋: 3, 承台: 3, 剪力墙: 3, COLUMN: 3, BEAM: 3, SLAB: 3, REBAR: 3, FOUND: 3, STRU: 2}

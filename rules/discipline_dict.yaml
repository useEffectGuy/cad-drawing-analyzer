version: "1.0"
description: 专业识别唯一词典（合并 classify_discipline / cad_analyze / map_wbs / aggregate 四处数据源）

# 专业排序（GB 50300 十大分部顺序优先）
order:
  - 总图
  - 建筑
  - 结构
  - 给排水
  - 消防
  - 暖通
  - 电气
  - 智能建筑
  - 装饰
  - 建筑节能
  - 电梯
  - 其他

# 判定优先级：drawing_no_prefix（最高） > content_weights（加权投票） > layer_keywords（弱判定）

# 图号前缀 → 专业（迁自 classify_discipline.py）
drawing_no_prefix:
  建施: 建筑
  JZ: 建筑
  JS: 建筑
  A: 建筑
  结施: 结构
  JG: 结构
  GS: 结构
  S: 结构
  水施: 给排水
  SS: 给排水
  PS: 给排水
  P: 给排水
  水: 给排水
  暖施: 暖通
  NS: 暖通
  M: 暖通
  通施: 暖通
  TS: 暖通
  电施: 电气
  DS: 电气
  E: 电气
  强电: 电气
  弱电: 电气
  设施: 给排水
  FS: 给排水
  装施: 装饰
  ZS: 装饰
  DE: 装饰
  总图: 总图
  总: 总图
  L: 总图
  Z: 总图
  消施: 消防
  XF: 消防
  消防: 消防
  智施: 智能建筑
  智能: 智能建筑

# 图名关键词 → 专业（迁自 classify_discipline.py）
name_keywords:
  建筑: [建施, 建筑, 平面, 立面, 剖面, 门窗, 楼梯, 卫生间, 厨房, 阳台]
  结构: [结施, 结构, 柱, 梁, 板, 基础, 钢筋, 承台, 剪力墙, 配筋, 平法]
  给排水: [水施, 给排水, 给水, 排水, 雨水, 污水, 消火栓, 喷淋, 管道, 阀门, 地漏, 水泵]
  暖通: [暖施, 暖通, 风管, 风口, 空调, 风机, 冷媒, 冷凝水, 排烟, 新风, 采暖]
  电气: [电施, 电气, 照明, 插座, 开关, 配电箱, 桥架, 电缆, 防雷, 接地, 强电, 弱电, 回路]
  消防: [消防, 火灾报警, 喷淋, 消火栓, 烟感, 温感]
  总图: [总平面, 红线, 道路, 绿化, 坐标, 竖向, 场地]
  装饰: [装饰, 装修, 地面, 墙面, 天花, 饰面]
  智能建筑: [智能, 弱电, 监控, 门禁, 网络, 综合布线]

# 内容加权投票词典（迁自 cad_analyze.py，供 DisciplineClassifier 三重投票）
content_weights:
